<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded Base Icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8" />
  
  <!-- Subtle Grid Accent -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.1" />

  <!-- Code Brackets & Cursor -->
  <g filter="url(#glow)">
    <!-- Left Bracket < -->
    <path d="M 190 156 L 90 256 L 190 356" fill="none" stroke="url(#bracketGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Cursor Bar / -->
    <path d="M 285 146 L 225 366" fill="none" stroke="#f1f5f9" stroke-width="28" stroke-linecap="round" stroke-opacity="0.85" />

    <!-- Right Bracket > -->
    <path d="M 322 156 L 422 256 L 322 356" fill="none" stroke="url(#bracketGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
